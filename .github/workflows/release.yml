# Release artifact workflow — runs on `v*` tag push, builds Tauri installers
# on Linux / Windows / macOS in parallel, and uploads them as GitHub release
# assets alongside the static dist tarball.
#
# v1.0.0 DoD: "Tagged v1.0.0 release has 4 installers + dist.tar.gz +
# LICENSES.md + RELEASE_NOTES_v1.0.md". The 4 installers come from this matrix
# (linux .deb + .AppImage from ubuntu-22.04, .msi from windows-latest, .dmg
# from macos-latest). RELEASE_NOTES + LICENSES.md are attached by the user
# from the release body / repo root and don't go through this workflow.
#
# This workflow only fires on tag push, so the v1.0.0 wrap script
# (`git push origin v1.0.0`) triggers it once and then it stays out of the
# way until the next tagged release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0). Manual runs only.'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux Tauri deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Sync version into Tauri
        run: bun run sync:version

      - name: Build static bundle
        run: bun run build

      - name: Build Tauri installer
        run: bun run tauri build

      - name: Stage installers
        shell: bash
        run: |
          mkdir -p staged
          # Linux: .deb + .AppImage
          find src-tauri/target/release/bundle -type f \
            \( -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) \
            -exec cp {} staged/ \;
          ls -la staged/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wyrdloom-${{ matrix.target }}
          path: staged/
          if-no-files-found: warn

  publish:
    name: Attach to GitHub release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build static bundle for tarball
        env:
          VITE_DEPLOY_BASE: /
        run: |
          bun install --frozen-lockfile
          bun run build
          tar -czf artifacts/dist.tar.gz dist/

      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "dist.tar.gz" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" release-assets/* --clobber
