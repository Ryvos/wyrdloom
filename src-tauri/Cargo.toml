[package]
name = "wyrdloom"
version = "0.5.0"
description = "WYRDLOOM — single-player isometric ARPG (Tauri shell)"
authors = ["WYRDLOOM contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "wyrdloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
